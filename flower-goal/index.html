<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Growlt — расти свои цели</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🌱Growlt</h1>
        <p>Посади цель — вырасти свой цветок!</p>
    </header>

    <main>

        <!-- ===== Форма создания цели ===== -->
        <section>
            <form id="goal-form">
                <label for="goal-input">Моя цель:</label>
                <input
                    type="text"
                    id="goal-input"
                    name="title"
                    placeholder="Например, выучить HTML"
                    autocomplete="off"
                    required>

                <label for="date-input">Дедлайн (дата и время):</label>
                <input
                    type="datetime-local"
                    id="date-input"
                    name="deadline"
                    required>

                <button type="submit" id="plant-btn">Посадить цветок</button>
            </form>
        </section>

        <!-- ===== Большой цветок — картинка ===== -->
        <section>
            <div id="flower"></div>
        </section>

        <!-- ===== Статистика: два счётчика ===== -->
        <section>
            <div id="stats">
                <div>Текущий прогресс: 0</div>
                <div>Всего выполнено: 0</div>
            </div>
        </section>

        <!-- ===== Вкладки и список целей ===== -->
        <section>
            <div class="tabs" role="tablist">
                <button
                    type="button"
                    id="tab-active"
                    class="tab-btn active"
                    role="tab"
                    aria-selected="true">
                    Активные
                </button>
                <button
                    type="button"
                    id="tab-done"
                    class="tab-btn"
                    role="tab"
                    aria-selected="false">
                    Выполненные
                </button>
            </div>

            <div id="goals-list"></div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
